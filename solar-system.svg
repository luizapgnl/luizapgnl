<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1b3a"/>
      <stop offset="100%" stop-color="#0b0c1e"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6b0"/>
      <stop offset="45%" stop-color="#ffc83d"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb300" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="440" rx="16" fill="url(#bg)"/>

  <!-- estrelas piscando -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="380" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="90" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="410" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="415" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="35" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="400" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="70" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="300" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="230" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="745" cy="170" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- órbitas -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <circle cx="400" cy="220" r="55"/>
    <circle cx="400" cy="220" r="85"/>
    <circle cx="400" cy="220" r="118"/>
    <circle cx="400" cy="220" r="150"/>
    <circle cx="400" cy="220" r="182"/>
    <circle cx="400" cy="220" r="210"/>
  </g>

  <!-- Sol -->
  <circle cx="400" cy="220" r="60" fill="url(#glow)">
    <animate attributeName="r" values="55;65;55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="220" r="26" fill="url(#sun)"/>

  <!-- Mercúrio -->
  <g>
    <circle cx="455" cy="220" r="4" fill="#b5b5b5"/>
    <animateTransform attributeName="transform" type="rotate" from="0 400 220" to="360 400 220" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Vênus -->
  <g>
    <circle cx="485" cy="220" r="6.5" fill="#e8c27a"/>
    <animateTransform attributeName="transform" type="rotate" from="90 400 220" to="450 400 220" dur="11s" repeatCount="indefinite"/>
  </g>

  <!-- Terra + Lua -->
  <g>
    <circle cx="518" cy="220" r="7" fill="#3b82f6"/>
    <circle cx="515" cy="218" r="3" fill="#34d399" opacity="0.8"/>
    <g>
      <circle cx="530" cy="220" r="1.8" fill="#d1d5db"/>
      <animateTransform attributeName="transform" type="rotate" from="0 518 220" to="360 518 220" dur="2.5s" repeatCount="indefinite"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="200 400 220" to="560 400 220" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- Marte -->
  <g>
    <circle cx="550" cy="220" r="5.5" fill="#ef4444"/>
    <animateTransform attributeName="transform" type="rotate" from="300 400 220" to="660 400 220" dur="26s" repeatCount="indefinite"/>
  </g>

  <!-- Júpiter -->
  <g>
    <circle cx="582" cy="220" r="12" fill="#d9a066"/>
    <ellipse cx="582" cy="218" rx="12" ry="2" fill="#b9793f" opacity="0.7"/>
    <ellipse cx="582" cy="224" rx="12" ry="1.6" fill="#b9793f" opacity="0.6"/>
    <animateTransform attributeName="transform" type="rotate" from="40 400 220" to="400 400 220" dur="45s" repeatCount="indefinite"/>
  </g>

  <!-- Saturno -->
  <g>
    <circle cx="610" cy="220" r="9" fill="#e6cf8b"/>
    <ellipse cx="610" cy="220" rx="17" ry="4.5" fill="none" stroke="#c9b06a" stroke-width="2" transform="rotate(-20 610 220)"/>
    <animateTransform attributeName="transform" type="rotate" from="150 400 220" to="510 400 220" dur="70s" repeatCount="indefinite"/>
  </g>

  <!-- legenda -->
  <text x="400" y="430" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffffff" fill-opacity="0.5">while (true) { aprender(); programar(); }</text>
</svg>
